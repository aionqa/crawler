version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: aionqa-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  back:
    build:
      context: .
      dockerfile: ./back/Dockerfile
    container_name: aionqa-back
    restart: unless-stopped
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongo:27017
      - DB_NAME=spa
      - ORIGIN=http://localhost:3000
      - LOGIN_SIMPLIFIED_URL=http://login-simplified:3001
      - LOGIN_TEXT_URL=http://login-text:3002
      - LOGIN_MEDIA_URL=http://login-media:3003
      - LOGIN_STATIC_URL=http://login-static:3004
      - CRAWLER_TEXT_URL=http://crawler-text:3101
      - CRAWLER_MEDIA_URL=http://crawler-media:3102
      - CRAWLER_SIMPLIFIED_URL=http://crawler-simplified:3103
      - CRAWLER_STATIC_URL=http://crawler-static:3104
    depends_on:
      - mongo
      - login-simplified
      - login-text
      - login-media
      - login-static
      - crawler-text
      - crawler-media
      - crawler-simplified
      - crawler-static
    ports:
      - "4000:4000"

  ui:
    build: ./ui
    container_name: aionqa-ui
    restart: unless-stopped
    depends_on:
      - back
    ports:
      - "3000:3000"

  login-simplified:
    build: ./login-simplified
    container_name: login-simplified
    restart: unless-stopped
    shm_size: '1gb'
    environment:
      - PORT=3001
    ports:
      - "3001:3001"

  login-text:
    build: ./login-text
    container_name: login-text
    restart: unless-stopped
    shm_size: '1gb'
    environment:
      - PORT=3002
    ports:
      - "3002:3002"

  login-media:
    build: ./login-media
    container_name: login-media
    restart: unless-stopped
    shm_size: '1gb'
    environment:
      - PORT=3003
    ports:
      - "3003:3003"

  login-static:
    build: ./login-static
    container_name: login-static
    restart: unless-stopped
    environment:
      - PORT=3004
    ports:
      - "3004:3004"

  crawler-text:
    build: ./crawler-text
    container_name: crawler-text
    restart: unless-stopped
    environment:
      - PORT=3101
    ports:
      - "3101:3101"

  crawler-media:
    build: ./crawler-media
    container_name: crawler-media
    restart: unless-stopped
    environment:
      - PORT=3102
    ports:
      - "3102:3102"

  crawler-simplified:
    build: ./crawler-simplified
    container_name: crawler-simplified
    restart: unless-stopped
    shm_size: '1gb'
    environment:
      - PORT=3103
    ports:
      - "3103:3103"

  crawler-static:
    build: ./crawler-static
    container_name: crawler-static
    restart: unless-stopped
    environment:
      - PORT=3104
    ports:
      - "3104:3104"

volumes:
  mongo_data:


