version: '3.8'

services:
  # Core infrastructure services
  mongo:
    image: mongo:6
    container_name: aionqa-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: aionqa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Main backend service
  back:
    build:
      context: .
      dockerfile: ./back/Dockerfile
    container_name: aionqa-back
    restart: unless-stopped
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379
      - DB_NAME=spa
      - ORIGIN=http://localhost:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOGIN_SIMPLIFIED_URL=http://login-simplified:3001
      - LOGIN_TEXT_URL=http://login-text:3002
      - LOGIN_MEDIA_URL=http://login-media:3003
      - LOGIN_STATIC_URL=http://login-static:3004
      - CRAWLER_SIMPLIFIED_URL=http://crawler-simplified:3101
      - CRAWLER_TEXT_URL=http://crawler-text:3102
      - CRAWLER_MEDIA_URL=http://crawler-media:3103
      - CRAWLER_STATIC_URL=http://crawler-static:3104
    depends_on:
      - mongo
      - redis
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Frontend UI
  ui:
    build: ./ui
    container_name: aionqa-ui
    restart: unless-stopped
    depends_on:
      - back
    ports:
      - "3000:3000"

  # Login agents - statically started with dynamic browser instances
  login-simplified:
    build:
      context: ./login-simplified
      dockerfile: Dockerfile
    container_name: aionqa-login-simplified
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3001
      - USE_REMOTE_BROWSER=true
      - BROWSER_SERVICE_URL=http://back:4000
    ports:
      - "3001:3001"
    depends_on:
      - back

  login-text:
    build:
      context: ./login-text
      dockerfile: Dockerfile
    container_name: aionqa-login-text
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3002
      - USE_REMOTE_BROWSER=true
      - BROWSER_SERVICE_URL=http://back:4000
    ports:
      - "3002:3002"
    depends_on:
      - back

  login-media:
    build:
      context: ./login-media
      dockerfile: Dockerfile
    container_name: aionqa-login-media
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3003
      - USE_REMOTE_BROWSER=true
      - BROWSER_SERVICE_URL=http://back:4000
    ports:
      - "3003:3003"
    depends_on:
      - back

  login-static:
    build:
      context: ./login-static
      dockerfile: Dockerfile
    container_name: aionqa-login-static
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3004
      - USE_REMOTE_BROWSER=true
      - BROWSER_SERVICE_URL=http://back:4000
    ports:
      - "3004:3004"
    depends_on:
      - back

  # Crawler agents - statically started with dynamic browser instances
  crawler-simplified:
    build:
      context: ./crawler-simplified
      dockerfile: Dockerfile
    container_name: aionqa-crawler-simplified
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3101
      - USE_REMOTE_BROWSER=true
      - BROWSER_SERVICE_URL=http://back:4000
    ports:
      - "3101:3101"
    depends_on:
      - back

  crawler-text:
    build:
      context: ./crawler-text
      dockerfile: Dockerfile
    container_name: aionqa-crawler-text
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3102
      - USE_REMOTE_BROWSER=true
      - BROWSER_SERVICE_URL=http://back:4000
    ports:
      - "3102:3102"
    depends_on:
      - back

  crawler-media:
    build:
      context: ./crawler-media
      dockerfile: Dockerfile
    container_name: aionqa-crawler-media
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3103
      - USE_REMOTE_BROWSER=true
      - BROWSER_SERVICE_URL=http://back:4000
    ports:
      - "3103:3103"
    depends_on:
      - back

  crawler-static:
    build:
      context: ./crawler-static
      dockerfile: Dockerfile
    container_name: aionqa-crawler-static
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=3104
      - USE_REMOTE_BROWSER=true
      - BROWSER_SERVICE_URL=http://back:4000
    ports:
      - "3104:3104"
    depends_on:
      - back

  # Manual analysis service
  manual-analysis:
    build:
      context: ./manual-analysis
      dockerfile: Dockerfile
    container_name: aionqa-manual-analysis
    restart: "no"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - DB_NAME=aionqa
      - PORT=3200
    ports:
      - "3200:3200"
    depends_on:
      - mongo
    profiles:
      - analysis

  # AI Chat service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: aionqa-ai-service
    restart: unless-stopped
    environment:
      - AI_SERVICE_PORT=5000
      - BACKEND_URL=http://back:4000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      - back

  # Dedicated browser instances - only started with 'browsers' profile
  browser-1:
    image: browserless/chrome:latest
    container_name: aionqa-browser-1
    restart: unless-stopped
    environment:
      - CONCURRENT=1
      - MAX_CONCURRENT=1
      - TOKEN=
      - KEEP_ALIVE=true
      - CHROME_REFRESH_TIME=300000
      - MAX_CPU=90
      - MAX_MEMORY=90
      - ENABLE_CORS=true
      - ENABLE_XVFB=false
      - PREBOOT_CHROME=true
      - FUNCTION_ENABLE_INCOGNITO_MODE=true
      - FUNCTION_ENABLE_GOOGLE=true
      - FUNCTION_BLOCK_ADS=true
      - FUNCTION_KEEP_ALIVE=true
    ports:
      - "9222:3000"
    labels:
      - "aionqa.browser=true"
      - "aionqa.browser.id=1"
    profiles:
      - browsers

  browser-2:
    image: browserless/chrome:latest
    container_name: aionqa-browser-2
    restart: unless-stopped
    environment:
      - CONCURRENT=1
      - MAX_CONCURRENT=1
      - TOKEN=
      - KEEP_ALIVE=true
      - CHROME_REFRESH_TIME=300000
      - MAX_CPU=90
      - MAX_MEMORY=90
      - ENABLE_CORS=true
      - ENABLE_XVFB=false
      - PREBOOT_CHROME=true
      - FUNCTION_ENABLE_INCOGNITO_MODE=true
      - FUNCTION_ENABLE_GOOGLE=true
      - FUNCTION_BLOCK_ADS=true
      - FUNCTION_KEEP_ALIVE=true
    ports:
      - "9223:3000"
    labels:
      - "aionqa.browser=true"
      - "aionqa.browser.id=2"
    profiles:
      - browsers

  browser-3:
    image: browserless/chrome:latest
    container_name: aionqa-browser-3
    restart: unless-stopped
    environment:
      - CONCURRENT=1
      - MAX_CONCURRENT=1
      - TOKEN=
      - KEEP_ALIVE=true
      - CHROME_REFRESH_TIME=300000
      - MAX_CPU=90
      - MAX_MEMORY=90
      - ENABLE_CORS=true
      - ENABLE_XVFB=false
      - PREBOOT_CHROME=true
      - FUNCTION_ENABLE_INCOGNITO_MODE=true
      - FUNCTION_ENABLE_GOOGLE=true
      - FUNCTION_BLOCK_ADS=true
      - FUNCTION_KEEP_ALIVE=true
    ports:
      - "9224:3000"
    labels:
      - "aionqa.browser=true"
      - "aionqa.browser.id=3"
    profiles:
      - browsers

  browser-4:
    image: browserless/chrome:latest
    container_name: aionqa-browser-4
    restart: unless-stopped
    environment:
      - CONCURRENT=1
      - MAX_CONCURRENT=1
      - TOKEN=
      - KEEP_ALIVE=true
      - CHROME_REFRESH_TIME=300000
      - MAX_CPU=90
      - MAX_MEMORY=90
      - ENABLE_CORS=true
      - ENABLE_XVFB=false
      - PREBOOT_CHROME=true
      - FUNCTION_ENABLE_INCOGNITO_MODE=true
      - FUNCTION_ENABLE_GOOGLE=true
      - FUNCTION_BLOCK_ADS=true
      - FUNCTION_KEEP_ALIVE=true
    ports:
      - "9225:3000"
    labels:
      - "aionqa.browser=true"
      - "aionqa.browser.id=4"
    profiles:
      - browsers

  browser-5:
    image: browserless/chrome:latest
    container_name: aionqa-browser-5
    restart: unless-stopped
    environment:
      - CONCURRENT=1
      - MAX_CONCURRENT=1
      - TOKEN=
      - KEEP_ALIVE=true
      - CHROME_REFRESH_TIME=300000
      - MAX_CPU=90
      - MAX_MEMORY=90
      - ENABLE_CORS=true
      - ENABLE_XVFB=false
      - PREBOOT_CHROME=true
      - FUNCTION_ENABLE_INCOGNITO_MODE=true
      - FUNCTION_ENABLE_GOOGLE=true
      - FUNCTION_BLOCK_ADS=true
